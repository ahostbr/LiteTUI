# Prometheus scrape config for the browser-monitor stack.
#
# The monitor is a PUSHER, not a scraper: it POSTs to the pushgateway on every
# sweep. Prometheus only ever scrapes the pushgateway. That is the whole of the
# data path, which is why this file is this short.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  # Uncomment to forward alerts (Slack, PagerDuty, SMTP) to an Alertmanager.
  # For the POC the rules are visible in the Prometheus UI under "Alerts"
  # without an Alertmanager running.
  # alertmanagers:
  #   - static_configs:
  #       - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: pushgateway
    # Metric relabel: keep the monitor's job label; drop the pushgateway's own
    # instance so the "target" identity comes from the pushed job/group labels.
    static_configs:
      - targets: ['pushgateway:9091']
